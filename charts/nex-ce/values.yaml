################################################################################
# Global options
################################################################################
global:
  image:
    # global image pull policy to use for all container images in the chart
    # can be overridden by individual image pullPolicy
    pullPolicy:
    # global list of secret names to use as image pull secrets for all pod specs in the chart
    # secrets must exist in the same namespace
    # https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
    pullSecretNames: []
    # global registry to use for all container images in the chart
    # can be overridden by individual image registry
    registry: registry.synadia.io

  # global labels will be applied to all resources deployed by the chart
  labels: {}

################################################################################
# Common options
################################################################################
# override name of the chart
nameOverride:
# override full name of the chart+release
fullnameOverride:
# override the namespace that resources are installed into
namespaceOverride:

################################################################################
# Nex CE Deployment and associated resources
################################################################################

############################################################
# config
############################################################
config:
  # Nex Node Name
  name:
  # Nexus Name
  nexus:
  tags: {}
  # Nex Node ID
  nodeSeed:
  # Nex Node NATS Credentials
  creds:
    jwt:
    seed:
  # Credential Signing Key
  credsSigning:
    signingKey:
    signingKeyAccount:
  allowRemoteRegister: false
  logLevel: "info"
  # namespaces the nexlets create workloads in; default to the release namespace
  # the chart creates a Role and RoleBinding in each one
  workloadsNamespace:
  connectorsNamespace:
  # per-nexlet keys map to the nexlet's k8sServiceAccountName, k8sImagePullSecrets, k8sDefaultCpu,
  # k8sDefaultMemoryMb and k8sMetricsPort; unset keys are omitted so nex-ce defaults apply.
  # nex-ce 0.3.3 parses only k8sNamespace and ignores the rest (see README, "Private registry")
  nexlets:
    # containers-kubernetes nexlet (Workloads)
    containers:
      enabled: true
      # serviceAccountName of workload pods; defaults to workloadServiceAccount.name when that is enabled
      serviceAccountName:
      # kubernetes.io/dockerconfigjson Secrets (in the workload namespace) for workload image pulls
      imagePullSecrets: []
      # cpu cores / memory MB when the run request sets no limits (requests = limits); nex-ce defaults 1 / 1024
      defaultCpu:
      defaultMemoryMb:
      # Prometheus /metrics port of the nexlet itself; unset or 0 disables it
      metricsPort:
    # connectors-kubernetes nexlet (Connectors)
    connectors:
      enabled: true
      serviceAccountName:
      imagePullSecrets: []
      defaultCpu:
      defaultMemoryMb:
      metricsPort:
  # Control Plane registration
  # when enabled, Control Plane supplies the nexus, control account and NATS credentials,
  # so nexus, creds and credsSigning are not used
  platform:
    enabled: false
    url: https://cloud.synadia.com
    # Workloads platform component token from Control Plane system settings
    token:
  # host a Synadia Catalog on this node
  # set container.env.YES_SEED to "true" to fill a new catalog on first start
  catalog:
    enabled: false
    name:
    # NUID of the catalog, from Control Plane system settings
    id:
    # Catalog platform component token from Control Plane system settings
    token:
  # URL for NATS Server
  url:
  # Certificate Authority for Validation of Server Certificate
  tls:
    # Mutual TLS for client connection to NATS Server
    clientCert:
      enabled: false
      # set secretName in order to mount an existing secret to dir
      secretName:
      dir: /etc/nex-ce/certs
      cert: tls.crt
      key: tls.key
    caCerts:
      enabled: false
      # set configMapName in order to mount an existing configMap to dir
      configMapName:
      # set secretName in order to mount an existing secretName to dir
      secretName:
      # directory to mount the configMap or secret to
      dir: /etc/nex-ce/ca-cert
      # key in the configMap or secret that contains the CA Certificate or Bundle
      key: ca.crt
    # Skip certificate validation
    # not supported by nex-ce; kept for compatibility
    insecureSkipVerify: false

############################################################
# deployment
############################################################
deployment:
  # keep at 1: two nodes with one seed duplicate logs and events
  replicas: 1

  # merge or patch the stateful set
  # https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.29/#deployment-v1-apps
  merge: {}
  patch: []
  # defaults to "{{ include "nce.fullname" $ }}"
  name:

############################################################
# deployment -> pod template
############################################################
podTemplate:
  # map of topologyKey: topologySpreadConstraint
  # labelSelector will be added to match Deployment pods
  #
  # topologySpreadConstraints:
  #   kubernetes.io/hostname:
  #     maxSkew: 1
  #
  topologySpreadConstraints: {}

  # merge or patch the pod template
  # https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.29/#pod-v1-core
  merge: {}
  patch: []

############################################################
# deployment -> pod template -> nex-ce container
############################################################
container:
  image:
    repository: nexce
    tag: 0.3.3
    pullPolicy:
    # defaults to global.registry
    registry:

  # map with key as env var name, value can be string or map
  # example:
  #
  #   env:
  #     MY_VAR: my_value
  #     MY_SECRET:
  #       valueFrom:
  #         secretKeyRef:
  #           name: secret-name
  #           key: secret-key
  env: {}

  # https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

  # merge or patch the container
  # https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.29/#container-v1-core
  merge: {}
  patch: []

############################################################
# other extension points
############################################################

# service account
serviceAccount:
  # enable/disable the service account
  enabled: true

  # merge or patch the service account
  # https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.29/#serviceaccount-v1-core
  merge: {}
  patch: []
  # defaults to "{{ include "nce.fullname" $ }}"
  name:

# service account of workload pods: no token is mounted and no Role is bound to it.
# Created in every workload namespace and used as the nexlets' k8sServiceAccountName
# unless config.nexlets.<nexlet>.serviceAccountName is set.
workloadServiceAccount:
  enabled: true

  # merge or patch the service account
  # https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.29/#serviceaccount-v1-core
  merge: {}
  patch: []
  # defaults to "{{ include "nce.fullname" $ }}-workload"
  name:

# config secret
configSecret:
  # merge or patch the context secret
  # https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.29/#secret-v1-core
  merge: {}
  patch: []
  # defaults to "{{ include "nce.fullname" $ }}-config"
  name:

# pod disruption budget
podDisruptionBudget:
  enabled: true
  # merge or patch the pod disruption budget
  # https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.29/#poddisruptionbudget-v1-policy
  merge: {}
  patch: []
  # defaults to "{{ include "nce.fullname" $ }}"
  name:

