apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: {{ .nceRoleNamespace | quote }}
  name: {{ .Values.serviceAccount.name }}-role
  labels:
    {{- include "nce.labels" $ | nindent 4 }}
rules:
# create/delete for workload start/stop; patch for the started-event annotation
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch", "create", "delete", "patch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
# per-workload config and credentials; patch sets the ownerReference
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create", "get", "list", "delete", "patch"]
# optional; harmless when metrics-server is absent
- apiGroups: ["metrics.k8s.io"]
  resources: ["pods"]
  verbs: ["get", "list"]
