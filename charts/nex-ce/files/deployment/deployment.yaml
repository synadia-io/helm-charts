apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.deployment.name }}
  labels:
    {{- include "nce.labels" $ | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "nce.selectorLabels" $ | nindent 6 }}

  replicas: {{ .Values.deployment.replicas }}

  # The node ID comes from config.nodeSeed, so a rolling update would briefly
  # run two nodes with one ID.
  strategy:
    type: Recreate

  template:
    {{- with .Values.podTemplate }}
    {{- include "nce.loadMergePatch" (merge (dict "file" "deployment/pod-template.yaml" "ctx" $) .) | nindent 4 }}
    {{- end }}
