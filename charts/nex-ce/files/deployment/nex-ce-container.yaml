name: nex-ce
{{ include "nce.image" (merge (pick .Values "global") .Values.container.image) }}

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL

args:
- node
- up
- --config
- /app/config.json

env:
{{- if .Values.config.catalog.enabled }}
# seed a new catalog with Synadia's connectors. nex skips this when the
# catalog's stream already exists, so an existing catalog is never changed.
- name: YES_SEED
  value: "true"
{{- end }}
{{- with .Values.container.env }}
{{- include "nce.env" . }}
{{- end }}

volumeMounts:
# tlsCA
{{- include "nce.tlsCAVolumeMount" $ }}
# secrets
{{- range (include "nce.secretNames" $ | fromJson).secretNames }}
- name: {{ .name | quote }}
  mountPath: {{ .dir | quote }}
{{- end }}
# configSecret
- name: config
  mountPath: /app/config.json
  subPath: config.json
