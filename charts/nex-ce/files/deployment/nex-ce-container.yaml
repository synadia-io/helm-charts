name: nex-ce
{{ include "nce.image" (merge (pick .Values "global") .Values.container.image) }}

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
    - ALL

args:
- node
- up
- --config
- /app/config.json

{{- with .Values.container.resources }}
resources:
  {{- toYaml . | nindent 2 }}
{{- end }}

env:
{{- with .Values.container.env }}
{{- include "nce.env" . }}
{{- end }}

volumeMounts:
# tlsCA
{{- include "nce.tlsCAVolumeMount" $ }}
# secrets
{{- range (include "nce.secretNames" $ | fromJson).secretNames }}
- name: {{ .name | quote }}
  mountPath: {{ .dir | quote }}
{{- end }}
# configSecret
- name: config
  mountPath: /app/config.json
  subPath: config.json
- name: tmp
  mountPath: /tmp
