# ServiceAccount of workload pods: no token is ever mounted and no Role is
# bound to it. Passed to the nexlets as k8sServiceAccountName.
apiVersion: v1
kind: ServiceAccount
metadata:
  namespace: {{ .nceRoleNamespace | quote }}
  name: {{ .Values.workloadServiceAccount.name }}
  labels:
    {{- include "nce.labels" $ | nindent 4 }}
automountServiceAccountToken: false
