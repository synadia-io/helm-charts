{{- with .Values.ingress }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  {{- include "ins.metadataNamespace" $ | nindent 2 }}
  name: {{ .name }}
  labels:
    {{- include "ins.labels" $ | nindent 4 }}
  {{- with .annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  rules:
  {{- $path := .path }}
  {{- $pathType := .pathType }}
  {{- $svc := $.Values.service.name }}
  {{- $port := $.Values.service.ports.http.port }}
  {{- range .hosts }}
  - host: {{ . | quote }}
    http:
      paths:
      - path: {{ $path | quote }}
        pathType: {{ $pathType | quote }}
        backend:
          service:
            name: {{ $svc }}
            port:
              number: {{ $port }}
  {{- end }}
  {{- if .tlsSecretName }}
  tls:
  - secretName: {{ .tlsSecretName | quote }}
    hosts:
    {{- toYaml .hosts | nindent 4 }}
  {{- end }}
{{- end }}
