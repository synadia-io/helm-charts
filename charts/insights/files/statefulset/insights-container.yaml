name: insights
{{ include "ins.image" (merge (pick .Values "global" "imagePullSecret") .Values.container.image) }}

env:
- name: INSIGHTS_DATA_DIR
  value: "/data"
- name: INSIGHTS_WEB_HOSTNAME
  value: "0.0.0.0"
- name: INSIGHTS_WEB_PORT
  value: {{ .Values.config.web.port | quote }}
- name: INSIGHTS_SINK_HOST
  value: {{ .Values.config.sink.host | quote }}
- name: INSIGHTS_SINK_PORT
  value: {{ .Values.config.sink.port | quote }}
{{- with .Values.config.sys.server }}
- name: INSIGHTS_SYS_SERVER
  value: {{ . | quote }}
{{- end }}
{{- with .Values.config.sys.user }}
- name: INSIGHTS_SYS_USER
  value: {{ . | quote }}
{{- end }}
{{- if .Values.config.sys.password }}
- name: INSIGHTS_SYS_PASSWORD
  valueFrom:
    secretKeyRef:
      name: {{ $.Values.configSecret.name | quote }}
      key: sys-password
{{- end }}
{{- if .Values.config.sys.nkey }}
- name: INSIGHTS_SYS_NKEY
  valueFrom:
    secretKeyRef:
      name: {{ $.Values.configSecret.name | quote }}
      key: sys-nkey
{{- end }}
{{- if .Values.config.sys.jwt }}
- name: INSIGHTS_SYS_JWT
  valueFrom:
    secretKeyRef:
      name: {{ $.Values.configSecret.name | quote }}
      key: sys-jwt
{{- end }}
{{- range (include "ins.sysFileSecrets" $ | fromJson).files }}
- name: {{ .env }}
  value: {{ printf "%s/%s" .dir .path | quote }}
{{- end }}
{{- if or .Values.config.license.token .Values.config.license.secretName }}
- name: INSIGHTS_LICENSE_FILE
  value: "/etc/insights/license/license.jwt"
{{- end }}
{{- with .Values.config.web.sessionSeed }}
- name: INSIGHTS_WEB_SESSION_SEED
  valueFrom:
    secretKeyRef:
      name: {{ $.Values.configSecret.name | quote }}
      key: session-seed
{{- end }}
{{- with .Values.config.db.memoryLimit }}
- name: INSIGHTS_DB_MEMORY_LIMIT
  value: {{ . | quote }}
{{- end }}
{{- if .Values.config.db.threads }}
- name: INSIGHTS_DB_THREADS
  value: {{ .Values.config.db.threads | quote }}
{{- end }}
{{- with .Values.config.db.retention.duration }}
- name: INSIGHTS_DB_RETENTION_DURATION
  value: {{ . | quote }}
{{- end }}
{{- with .Values.config.scraper.interval }}
- name: INSIGHTS_SCRAPER_INTERVAL
  value: {{ . | quote }}
{{- end }}
{{- if .Values.config.simulator.enabled }}
- name: INSIGHTS_SIMULATOR_ENABLED
  value: "true"
{{- with .Values.config.simulator.profile }}
- name: INSIGHTS_SIMULATOR_PROFILE
  value: {{ . | quote }}
{{- end }}
{{- end }}
{{- with .Values.container.env }}
{{- include "ins.env" . }}
{{- end }}

ports:
- name: http
  containerPort: {{ .Values.config.web.port }}
- name: nats
  containerPort: {{ .Values.config.sink.port }}

{{- with .Values.container.startupProbe }}
startupProbe:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- with .Values.container.livenessProbe }}
livenessProbe:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- with .Values.container.readinessProbe }}
readinessProbe:
  {{- toYaml . | nindent 2 }}
{{- end }}

{{- with .Values.container.resources }}
resources:
  {{- toYaml . | nindent 2 }}
{{- end }}

volumeMounts:
- name: data
  mountPath: "/data"
{{- range (include "ins.sysFileSecrets" $ | fromJson).files }}
- name: {{ .name }}
  mountPath: {{ .dir | quote }}
  readOnly: true
{{- end }}
{{- if or .Values.config.license.token .Values.config.license.secretName }}
- name: license
  mountPath: /etc/insights/license
  readOnly: true
{{- end }}
{{- with .Values.extraVolumeMounts }}
{{- toYaml . | nindent 0 }}
{{- end }}
