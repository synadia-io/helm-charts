apiVersion: v1
kind: Secret
metadata:
  {{- include "ins.metadataNamespace" $ | nindent 2 }}
  name: {{ .Values.configSecret.name }}
  labels:
    {{- include "ins.labels" $ | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.config.sys.password }}
  sys-password: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.sys.nkey }}
  sys-nkey: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.sys.jwt }}
  sys-jwt: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.license.token }}
  license.jwt: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.web.sessionSeed }}
  session-seed: {{ . | quote }}
  {{- end }}
