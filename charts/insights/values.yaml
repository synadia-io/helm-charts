# Insights subcommand the container runs:
#
#   serve       A full instance that scrapes, indexes and serves the UI. Runs as
#               a one-replica StatefulSet with the data volume.
#   web         The web UI alone, reaching an instance over NATS.
#   http        HTTP gateway over the read-only query API.
#   mcp         MCP server over the read-only query API, on its http transport.
#   prometheus  One /metrics endpoint for every node in the deployment.
#
# Everything but serve is a stateless NATS client: it runs as a Deployment of
# replicaCount pods with no data volume, and needs a NATS connection
# (config.nats.server, INSIGHTS_NATS_SERVER, or --server).
subcommand: serve

# Arguments appended after the subcommand and --config. A flag outranks the
# same setting in extraEnv and in config.
extraArgs: []

# Replicas of a stateless subcommand. serve runs one, and so does mcp, which
# keeps client sessions in process memory.
replicaCount: 1

# Application configuration. This map is written directly to config.yaml, so
# keys below `config` match the Insights config file one-for-one.
#
# See https://docs.synadia.com/insights/reference/configuration for the
# complete configuration reference.
#
# serve needs a system to observe, so its config also sets one of
# `simulator.enabled`, `sys`, or `systems`. The chart refuses to render
# without one.
#
# http, mcp, and prometheus bind loopback by default, so the chart listens on
# the pod network for them where config leaves the address unset:
# `http.listen` 0.0.0.0:8080, `mcp.http` 0.0.0.0:8090 (with `mcp.transport`
# http), and `prometheus.hostname` 0.0.0.0.
config:
  # Persist DuckDB and embedded JetStream data on the chart's data volume.
  data-dir: /var/lib/insights
  # Listen on the pod network rather than loopback.
  web:
    hostname: 0.0.0.0

image:
  registry: registry.synadia.io
  # Empty selects "insights-licensed" when config.license.token or
  # config.license.file is set, and "insights" otherwise.
  repository: ""
  # Empty uses the chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

nameOverride: ""
fullnameOverride: ""

configSecret:
  # Mount a complete config.yaml from an existing Secret instead of creating
  # one from config above. The chart cannot infer licensing from an opaque
  # existing Secret. Also set image.repository when it is licensed,
  # service.targetPort for a non-default web port, and null the probes when its
  # web server is disabled.
  existingSecret: ""
  key: config.yaml

# Seed Insights signs web session cookies with, taken from a Secret you manage
# and injected as INSIGHTS_WEB_SESSION_SEED. Empty leaves the application
# default in place, which is the literal string `insights` and therefore the
# same value in every deployment that does not override it.
#
# The environment variable outranks `config.web.session-seed`, so set one or the
# other. Referencing a Secret keeps the seed out of values and out of git.
sessionSeed:
  existingSecret: ""
  key: seed

# ServiceAccount for the pod. Insights calls no Kubernetes or cloud API, so it
# needs no permissions and the pod mounts no token. A dedicated account exists
# because the surrounding platform may still need the pod to carry an identity,
# which is expressed as annotations: an IAM role on EKS, a Google service
# account on GKE, and nothing at all when self-hosted.
#
# Set create to false to attach an account you manage. Leaving name empty then
# falls back to the namespace default.
serviceAccount:
  create: true
  name: ""
  annotations: {}

service:
  type: ClusterIP
  port: 8080
  # Empty follows config.web.port for a managed config, or service.port for an
  # opaque existing config Secret.
  targetPort: ""
  annotations: {}

# The data volume of serve. The stateless subcommands mount none.
persistence:
  enabled: true
  # Use an existing PVC instead of a StatefulSet volume claim template.
  existingClaim: ""
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  # Used when configSecret.existingSecret is set and the chart cannot inspect
  # its data-dir setting.
  mountPath: /var/lib/insights

resources: {}

podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  # Gives the data volume to the pod's group so a non-root process can write
  # it. OnRootMismatch keeps Kubernetes from walking the whole volume on every
  # start once ownership is correct.
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# Probes hit /healthz rather than opening a socket. The listener binds before
# its routes are registered, so a TCP connect can succeed while the app is
# still starting; /healthz answers only once Insights is actually serving.
#
# Requires Insights 0.1.10 or newer, which is where /healthz was added. If you
# pin image.tag to an older release, override these back to `tcpSocket: {port:
# http}` or the pod will never become ready.
#
# mcp and prometheus serve no /healthz, so for them the chart turns a /healthz
# check into a TCP check on the same port.
startupProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 10
  failureThreshold: 30

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 15
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 10
  failureThreshold: 3

# Escape hatches for file-based NATS credentials, TLS material, or a license
# file referenced by config.
extraVolumes: []
extraVolumeMounts: []

# map with key as env var name, value can be string or map
# example:
#
#   extraEnv:
#     MY_VAR: my_value
#     MY_SECRET:
#       valueFrom:
#         secretKeyRef:
#           name: secret-name
#           key: secret-key
#
# A notification endpoint in config can reference a variable set here, keeping
# its secret out of this file:
#
#   config:
#     notifications:
#       webhook:
#         - name: alerts
#           url: https://hooks.example.com/insights
#           auth-type: bearer
#           auth-token: "${WEBHOOK_TOKEN}"
#   extraEnv:
#     WEBHOOK_TOKEN:
#       valueFrom:
#         secretKeyRef:
#           name: insights-webhook
#           key: token
extraEnv: {}
