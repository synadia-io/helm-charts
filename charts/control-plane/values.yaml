################################################################################
# Global options
################################################################################
global:
  image:
    # global image pull policy to use for all container images in the chart
    # can be overridden by individual image pullPolicy
    pullPolicy:
    # global registry to use for all container images in the chart
    # can be overridden by individual image registry
    registry:

  # global labels will be applied to all resources deployed by the chart
  labels: {}

################################################################################
# Control Plane StatefulSet and associated resources
################################################################################

############################################################
# image pull secret
############################################################
# when enabled, the registry for images in the control plane stateful set
# will default to imagePullSecret.registry
imagePullSecret:
  enabled: true
  registry: registry.synadia.io
  username:
  password:

  # merge or patch the image pull secret
  # https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.24/#secret-v1-core
  merge: {}
  patch: []
  # defaults to "{{ include "scp.fullname" $ }}-regcred"
  name:

############################################################
# config
############################################################
# due to the potentially sensitive nature of some of the configuration
# options, the entire configuration will be stored in a Kubernetes Secret
#
config:
  # standalone: no login, every user is an admin.
  # managed: requires login and config.merge.license.enabled=true
  mode: standalone

  server:
    # URL where Control Plane server will be accessed
    url:
    # port for HTTP server to listen on
    httpPort: 8080
    # port for HTTPS server to listen on, TLS must be enabled
    httpsPort: 8443
    # TLS options
    tls:
      enabled: false
      # set secretName in order to mount an existing secret to dir
      secretName:
      dir: /etc/syn-cp/certs/server
      cert: tls.crt
      key: tls.key
      ca:
      # merge or patch the tls config
      merge: {}
      patch: []

    # merge or patch the server config
    merge: {}
    patch: []

  kms:
    # if the key is not configured, a default KMS key will be generated and written to the data PVC
    # set secretName to mount a Secret whose key file contains a KMS URL
    key:
      # set to use a KMS URL
      url:
      # set secretName and key in order to mount an existing secret to dir
      secretName:
      dir: /etc/syn-cp/kms
      key: key.enc

    # rotatedKeys is a list of:
    # - # set to use a KMS URL
    #   url:
    #   # set secretName and key in order to mount an existing secret to dir
    #   secretName:
    #   # defaults to /etc/syn-cp/kms/rotated-key-<index>
    #   dir:
    #   key: key.enc
    rotatedKeys: []

    # merge or patch the KMS config
    merge: {}
    patch: []

  dataSources:
    prometheus:
      # URL to external Prometheus. When unset, the internal Prometheus stores data on the data PVC
      url:
      tls:
        enabled: false
        # set secretName in order to mount an existing secret to dir
        secretName:
        dir: /etc/syn-cp/certs/prometheus
        cert:
        key:
        ca: tls.ca
        # merge or patch the tls config
        merge: {}
        patch: []

      # merge or patch the prometheus config
      merge: {}
      patch: []

  # merge or patch the config
  merge: {}
  patch: []

############################################################
# stateful set
############################################################
# runs 1 replica, HA is not supported yet
statefulSet:
  # merge or patch the stateful set
  # https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.24/#statefulset-v1-apps
  merge: {}
  patch: []
  # defaults to "{{ include "scp.fullname" $ }}"
  name:

############################################################
# stateful set -> volume claim template
############################################################
# all Control Plane state is stored on this volume
# volume claim templates cannot change after install, resize the PVC directly
persistence:
  size: 20Gi
  storageClassName:

  # merge or patch the volume claim template
  # https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.24/#persistentvolumeclaim-v1-core
  merge: {}
  patch: []

############################################################
# stateful set -> pod template
############################################################
podTemplate:
  # adds a hash of the Config Secret as a pod annotation
  # this will cause the StatefulSet to roll when the Config Secret is updated
  configChecksumAnnotation: true

  # map of topologyKey: topologySpreadConstraint
  # labelSelector will be added to match StatefulSet pods
  #
  # topologySpreadConstraints:
  #   kubernetes.io/hostname:
  #     maxSkew: 1
  #
  topologySpreadConstraints: {}

  # merge or patch the pod template
  # https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.24/#pod-v1-core
  merge: {}
  patch: []

############################################################
# stateful set -> pod template -> syn-cp container
############################################################
container:
  image:
    repository: control-plane
    tag: 2.0.0
    pullPolicy:
    # defaults to imagePullSecret.registry if imagePullSecret is enabled
    # defaults to global.registry if imagePullSecret is disabled
    registry:

  # map with key as env var name, value can be string or map
  # example:
  #
  #   env:
  #     MY_VAR: my_value
  #     MY_SECRET:
  #       valueFrom:
  #         secretKeyRef:
  #           name: secret-name
  #           key: secret-key
  env: {}

  # merge or patch the container
  # https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.24/#container-v1-core
  merge: {}
  patch: []

############################################################
# service
############################################################
service:
  # service port options
  # https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.24/#serviceport-v1-core
  ports:
    http:
      enabled: true
      port: 80
    # config.server.tls must also be enabled
    https:
      enabled: true
      port: 443

  # merge or patch the service
  # https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.24/#service-v1-core
  merge: {}
  patch: []
  # defaults to "{{ include "scp.fullname" $ }}"
  name:

############################################################
# headless service
############################################################
# gives each pod a stable DNS name for peer discovery, includes pods that are not ready
# clients must use the service above, which only routes to ready pods
headlessService:
  # merge or patch the headless service
  # https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.24/#service-v1-core
  merge: {}
  patch: []
  # defaults to "{{ include "scp.fullname" $ }}-headless"
  # cannot change after install
  name:

############################################################
# ingress
############################################################
# service must be enabled also
ingress:
  enabled: false
  # must contain at least 1 host otherwise ingress will not be created
  hosts: []
  path: /
  pathType: Prefix
  # sets to the ingress class name
  className:
  # set to an existing secret name to enable TLS on the ingress; applies to all hosts
  tlsSecretName:

  # merge or patch the ingress
  # https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.24/#ingress-v1-networking-k8s-io
  merge: {}
  patch: []
  # defaults to "{{ include "scp.fullname" $ }}"
  name:

############################################################
# other extension points
############################################################

# config secret
configSecret:
  # merge or patch the config secret
  # https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.24/#secret-v1-core
  merge: {}
  patch: []
  # defaults to "{{ include "scp.fullname" $ }}-config"
  name:

# service account
serviceAccount:
  # enable/disable the service account
  enabled: false
  
  # merge or patch the service account
  # https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.24/#serviceaccount-v1-core
  merge: {}
  patch: []
  # defaults to "{{ include "scp.fullname" $ }}"
  name:


