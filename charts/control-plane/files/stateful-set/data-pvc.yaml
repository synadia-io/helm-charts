{{- with .Values.persistence }}
metadata:
  name: data
  annotations:
    helm.sh/resource-policy: keep
  # volume claim templates are immutable, so use labels that do not change between chart versions
  labels:
    {{- include "scp.selectorLabels" $ | nindent 4 }}
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: {{ .size | quote }}
  {{- with .storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
{{- end }}
