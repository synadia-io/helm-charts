name: syn-cp
{{ include "scp.image" (merge (pick .Values "global" "imagePullSecret") .Values.container.image) }}

args:
- server
- -c
- /etc/syn-cp/syn-cp.json

{{- with .Values.container.env }}
env:
{{- include "scp.env" . }}
{{- end }}

ports:
- name: http
  containerPort: {{ .Values.config.server.httpPort }}
{{- if .config.server.tls }}
- name: https
  containerPort: {{ .Values.config.server.httpsPort }}
{{- end }}

# allows for the 3 minute HA bootstrap timeout
startupProbe:
  periodSeconds: 5
  failureThreshold: 60
  httpGet:
    path: /healthz
    port: http

readinessProbe:
  periodSeconds: 10
  failureThreshold: 3
  httpGet:
    path: /healthz
    port: http

livenessProbe:
  periodSeconds: 10
  failureThreshold: 3
  httpGet:
    path: /healthz
    port: http

# keeps a stopping pod serving until the Services drop it
lifecycle:
  preStop:
    sleep:
      seconds: 5

# the last log lines become the termination message of a failed container
terminationMessagePolicy: FallbackToLogsOnError

volumeMounts:
# config secret
- name: config
  mountPath: /etc/syn-cp
# data pvc
- name: data
  mountPath: {{ .config.data_dir | quote }}
# external secrets
{{- range (include "scp.secretNames" $ | fromJson).secretNames }}
- name: {{ .name | quote }}
  mountPath: {{ .dir | quote }}
{{- end }}
