metadata:
  labels:
    {{- include "scp.labels" $ | nindent 4 }}
  annotations:
    {{- if .Values.podTemplate.configChecksumAnnotation }}
    {{- $configSecret := include "scp.loadMergePatch" (merge (dict "file" "config-secret.yaml" "ctx" $) .Values.configSecret) | fromYaml }}
    {{- /* the pods do not read the chart 1.x config, so dropping it after the upgrade from 1.x does not roll them */}}
    {{- $_ := unset ($configSecret.stringData | default dict) "syn-cp.yaml" }}
    checksum/config: {{ toYaml $configSecret | sha256sum }}
    {{- end }}
spec:
  containers:
  # syn-cp
  {{- with .Values.container }}
  - {{ include "scp.loadMergePatch" (merge (dict "file" "stateful-set/syn-cp-container.yaml" "ctx" $) .) | nindent 4 }}
  {{- end }}

  # don't need service env vars
  enableServiceLinks: false

  {{- with .Values.imagePullSecret }}
  {{- if .enabled }}
  imagePullSecrets:
  - name: {{ .name | quote }}
  {{- end }}
  {{- end }}

  securityContext:
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch

  {{- with .Values.serviceAccount }}
  {{- if .enabled }}
  serviceAccountName: {{ .name | quote }}
  {{- end }}
  {{- end }}

  {{- with .Values.podTemplate.topologySpreadConstraints }}
  topologySpreadConstraints:
  {{- range $k, $v := . }}
  - {{ merge (dict "topologyKey" $k "labelSelector" (dict "matchLabels" (include "scp.selectorLabels" $ | fromYaml))) $v | toYaml | nindent 4 }}
  {{- end }}
  {{- end}}

  volumes:
  # config secret
  - name: config
    secret:
      secretName: {{ .Values.configSecret.name }}
  # external secrets
  {{- range (include "scp.secretNames" $ | fromJson).secretNames }}
  - name: {{ .name | quote }}
    secret:
      secretName: {{ .secretName | quote }}
  {{- end }}
