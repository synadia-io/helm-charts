apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.configSecret.name }}
  labels:
    {{- include "scp.labels" $ | nindent 4 }}
type: Opaque
stringData:
  # the server parses the config file as CUE, which accepts JSON but not YAML
  syn-cp.json: |
    {{- toPrettyJson .config | nindent 4 }}
  # chart 1.x wrote its config here, and an apply that drops a key leaves its old value in the Secret
  # it is kept while the 1.x Deployment exists, so that a failed upgrade leaves 1.x its config
  syn-cp.yaml: {{ .v1Config | default "" | toJson }}
