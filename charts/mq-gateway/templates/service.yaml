apiVersion: v1
kind: Service
metadata:
  name: {{ include "mq-gateway.fullname" . }}
  labels:
    {{- include "mq-gateway.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "mq-gateway.selectorLabels" . | nindent 4 }}
  ports:
    {{- range include "mq-gateway.listeners" . | fromYamlArray }}
    - name: {{ .name }}
      port: {{ .port }}
      targetPort: {{ .name }}
      protocol: TCP
    {{- end }}
