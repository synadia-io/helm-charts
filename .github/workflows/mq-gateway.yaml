name: mq-gateway

on:
  pull_request:
    paths:
    - charts/mq-gateway/**
    - .github/workflows/mq-gateway.yaml

jobs:
  test:
    runs-on: ubuntu-latest
    steps:

    - name: Setup repo
      uses: actions/checkout@v4

    - name: Install Helm
      uses: azure/setup-helm@v4.1.0
      with:
        version: v3.17.3

    - name: Helm lint
      run: |
        helm lint --strict charts/mq-gateway \
          --set nats.url=nats://nats:4222 --set-json 'config.mqtt={}'

    - name: Test rendered variants
      shell: bash
      run: |
        set -euo pipefail
        base=(--set nats.url=nats://nats:4222 --set-json 'config.mqtt={}')
        # set -e ignores a command negated with !, so refusals are asserted
        # explicitly.
        refused() { if "$@" > /dev/null 2>&1; then echo "succeeded: $*"; exit 1; fi; }
        # rejects WANT CMD...: CMD fails with an error containing WANT.
        rejects() {
          local want=$1 out; shift
          if out=$("$@" 2>&1); then echo "rendered: $*"; exit 1; fi
          grep -qF -- "$want" <<< "$out" || { echo "want '$want' from $*, got: $out"; exit 1; }
        }

        helm template default charts/mq-gateway "${base[@]}" > /tmp/default.yaml
        grep -q 'image: "registry.synadia.io/mq-gateway:' /tmp/default.yaml
        grep -q 'kind: PodDisruptionBudget' /tmp/default.yaml
        grep -q 'path: /readyz' /tmp/default.yaml
        grep -q 'containerPort: 1883' /tmp/default.yaml
        # A stopping pod drains through lame duck mode, and is given the
        # lame duck duration plus 20s to do it.
        grep -q -- '- signal' /tmp/default.yaml
        grep -q 'terminationGracePeriodSeconds: 140' /tmp/default.yaml
        helm template ldm charts/mq-gateway "${base[@]}" --set config.ldm.duration=1m30s \
          | grep -q 'terminationGracePeriodSeconds: 110'
        refused grep -q 'containerPort: 5672' /tmp/default.yaml

        # A license from a Secret or in the config selects the licensed image.
        helm template licensed charts/mq-gateway "${base[@]}" \
          --set license.existingSecret=mqgw-license > /tmp/licensed.yaml
        grep -q 'image: "registry.synadia.io/mq-gateway-licensed:' /tmp/licensed.yaml
        grep -q 'file: /etc/mq-gateway/license/license.jwt' /tmp/licensed.yaml
        helm template token charts/mq-gateway "${base[@]}" \
          --set-string config.license.token=test-license \
          | grep -q 'image: "registry.synadia.io/mq-gateway-licensed:'

        # Every listener in the config becomes a container and Service port.
        helm template listeners charts/mq-gateway "${base[@]}" \
          --set-json 'config.mqtt={"listeners":[{"addr":":1883"},{"name":"ws","addr":":8080","ws-path":"/mqtt"}]}' \
          --set-json 'config.amqp={}' > /tmp/listeners.yaml
        grep -q 'name: ws' /tmp/listeners.yaml
        grep -q 'containerPort: 8080' /tmp/listeners.yaml
        grep -q 'containerPort: 5672' /tmp/listeners.yaml

        # Mounted credentials and TLS are named in the config file.
        helm template secrets charts/mq-gateway "${base[@]}" \
          --set nats.credentials.existingSecret=gw-creds \
          --set nats.tls.existingSecret=nats-tls \
          --set tls.existingSecret=listener-tls > /tmp/secrets.yaml
        grep -q 'creds: /etc/mq-gateway/nats/nats.creds' /tmp/secrets.yaml
        grep -q 'ca: /etc/mq-gateway/nats-tls/ca.crt' /tmp/secrets.yaml
        grep -q 'cert: /etc/mq-gateway/tls/tls.crt' /tmp/secrets.yaml

        helm template external charts/mq-gateway \
          --set configSecret.existingSecret=my-config \
          --set-json 'configSecret.listeners=[{"name":"mqtt","port":1883}]' > /tmp/external.yaml
        refused grep -q 'checksum/config' /tmp/external.yaml
        grep -q 'secretName: my-config' /tmp/external.yaml

        # extraEnv takes both a literal and a whole EnvVar body.
        helm template extra-env charts/mq-gateway "${base[@]}" \
          --set extraEnv.PLAIN=hello \
          --set extraEnv.FROM_SECRET.valueFrom.secretKeyRef.name=other \
          --set extraEnv.FROM_SECRET.valueFrom.secretKeyRef.key=k > /tmp/env.yaml
        grep -q 'value: "hello"' /tmp/env.yaml
        grep -q 'name: FROM_SECRET' /tmp/env.yaml

        # Configs that cannot deploy must fail to render: no protocol, no
        # NATS servers, a shared gateway id, a listener name Kubernetes
        # refuses as a port name, no health port, a lame duck duration it
        # cannot read, servers given twice.
        rejects 'serves no protocol' helm template invalid charts/mq-gateway --set nats.url=nats://nats:4222
        rejects 'nats.url is required' helm template invalid charts/mq-gateway --set-json 'config.mqtt={}'
        rejects 'config.id is set' helm template invalid charts/mq-gateway "${base[@]}" --set config.id=gw
        rejects 'not a valid Kubernetes port name' helm template invalid charts/mq-gateway \
          --set nats.url=nats://nats:4222 \
          --set-json 'config.mqtt={"listeners":[{"name":"Public_MQTT","addr":":1883"}]}'
        rejects 'config.monitor.addr is required' helm template invalid charts/mq-gateway "${base[@]}" --set config.monitor=null
        rejects 'is not a duration' helm template invalid charts/mq-gateway "${base[@]}" --set config.ldm.duration=2x
        rejects 'not config.nats.url' helm template invalid charts/mq-gateway "${base[@]}" --set config.nats.url=nats://other:4222

        helm package charts/mq-gateway --destination /tmp
