name: insights

on:
  pull_request:
    paths:
    - charts/insights/**
    - .github/workflows/insights.yaml

jobs:
  test:
    runs-on: ubuntu-latest
    steps:

    - name: Setup repo
      uses: actions/checkout@v4

    - name: Install Helm
      uses: azure/setup-helm@v4.1.0
      with:
        version: v3.17.3

    - name: Helm lint
      run: helm lint --strict charts/insights --set config.simulator.enabled=true

    - name: Test rendered variants
      shell: bash
      run: |
        set -euo pipefail

        helm template default charts/insights \
          --set config.simulator.enabled=true > /tmp/insights-default.yaml
        grep -q 'image: "registry.synadia.io/insights:' /tmp/insights-default.yaml

        helm template licensed charts/insights \
          --set config.simulator.enabled=true \
          --set-string config.license.token=test-license > /tmp/insights-licensed.yaml
        grep -q 'image: "registry.synadia.io/insights-licensed:' /tmp/insights-licensed.yaml

        helm template disabled charts/insights \
          --set config.simulator.enabled=true \
          --set config.web.enabled=false > /tmp/insights-disabled.yaml
        ! grep -q 'startupProbe:' /tmp/insights-disabled.yaml
        ! grep -q 'livenessProbe:' /tmp/insights-disabled.yaml
        ! grep -q 'readinessProbe:' /tmp/insights-disabled.yaml

        helm template external charts/insights \
          --set configSecret.existingSecret=my-config \
          --set service.targetPort=8888 > /tmp/insights-external.yaml
        grep -q 'containerPort: 8888' /tmp/insights-external.yaml

        # The seed reaches the container only when an operator supplies a
        # Secret to take it from; otherwise the application default stands.
        ! grep -q 'INSIGHTS_WEB_SESSION_SEED' /tmp/insights-default.yaml

        helm template seeded charts/insights \
          --set config.simulator.enabled=true \
          --set sessionSeed.existingSecret=my-seed > /tmp/insights-seeded.yaml
        grep -q 'name: INSIGHTS_WEB_SESSION_SEED' /tmp/insights-seeded.yaml
        grep -q 'name: my-seed' /tmp/insights-seeded.yaml

        # extraEnv takes both a literal and a whole EnvVar body, and rejects
        # anything else rather than emitting invalid YAML.
        helm template extra-env charts/insights \
          --set config.simulator.enabled=true \
          --set extraEnv.PLAIN=hello \
          --set extraEnv.FROM_SECRET.valueFrom.secretKeyRef.name=other \
          --set extraEnv.FROM_SECRET.valueFrom.secretKeyRef.key=k > /tmp/insights-env.yaml
        grep -q 'value: "hello"' /tmp/insights-env.yaml
        grep -q 'name: FROM_SECRET' /tmp/insights-env.yaml
        ! helm template bad-env charts/insights \
          --set config.simulator.enabled=true \
          --set 'extraEnv.BAD={a,b}' > /dev/null 2>&1

        # A config that observes no system must fail to render.
        ! helm template invalid charts/insights > /dev/null 2>&1

        helm package charts/insights --destination /tmp
